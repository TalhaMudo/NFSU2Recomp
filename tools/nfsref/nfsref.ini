; NFSRef ayarlari.  Port'un otomatik test kosusuyla AYNI tutulmali
; (AUTOSEQ / DUMPFRAME / QUITFRAMES / MOUSEAT / NOMOVIES).
[nfsref]
; kare:DIK-kodu[:sure]  (0x1C = Enter)  menulerden Quick Race / Resort Loop
autoseq=1000:0x1C,1350:0x1C,1700:0x1C,2050:0x1C,2400:0x1C,2750:0x1C,3100:0x1C,3700:0x1C,4000:0x1C
; arka tamponu BMP olarak kaydedilecek kareler
kareler=1300,1650,2000,2350,2700,3050,5000,5300,5600,5800,6200,6500,6800,7100,7400,7700,8000,8300,8600,8900
; butun D3D cagrilarinin dokulecegi kareler
dokum=1650,3050,5800,8900
; bu karede oyun kendini kapatir
cikis=8950
fare_x=5
fare_y=5
video_yok=1
; oyunu gercek 60 fps'e sabitle (port testindeki PACE60 gibi)
hiz60=1
; Present'i fonksiyon girisinden yakala (vtable atlansa bile)
hotpatch=1
; bu kadar saniyeden sonra oyun kendini kapatir (emniyet)
sure_siniri=420
; dokum karelerinde: doku icerik ozeti, hedef dokularin (yansima kup haritasi vb.) goruntusu
doku_ozet=1
hedef_doku=1
; gölgelendirici bayt kodlari (golge\ klasoru)
golge_dokum=1
; DirectSound kaydi (ses_log.txt + ses_veri.bin), veri siniri MB
ses=1
ses_sinir_mb=150
; sorun ayiklama: kanca gruplarini tek tek kapatmak icin 0 yapin
saat=1
girdi=1
kayit=1
dosya=1
